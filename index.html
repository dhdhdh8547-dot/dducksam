<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>떡삼 부스 시간표 </title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    padding: 25px;
    font-family: Arial, "Malgun Gothic", sans-serif;
    background: white;
    color: #111;
}

/* 상단 컨트롤 영역 */
.top-bar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 20px;
}

h1 {
    margin: 0;
    font-size: 28px;
}

/* 작고 색상 없는 인쇄 버튼 */
.print-btn {
    padding: 4px 8px;
    font-size: 12px;
    background: transparent;
    color: #666;
    border: 1px solid #ccc;
    border-radius: 4px;
    cursor: pointer;
}

.print-btn:hover {
    background: #f0f0f0;
    color: #333;
}

/* 시간표 */
.schedule {
    width: 100%;
    border-collapse: collapse;
    table-layout: fixed;
    margin-bottom: 35px;
    page-break-inside: avoid;
}

.schedule th,
.schedule td {
    border: 1px solid #888;
    text-align: center;
    vertical-align: middle;
    height: 55px;
    padding: 5px;
    word-break: keep-all;
}

.schedule th {
    background: #f5f5f5;
    font-weight: bold;
    font-size: 17px;
}

.schedule .title {
    height: 45px;
    text-align: left;
    padding-left: 12px;
    font-size: 21px;
    font-weight: bold;
}

/* 날짜별 제목 색상 */
.day15 .title { background: #f3dfd0; }
.day16 .title { background: #fff1c4; }
.day17 .title { background: #dcecf8; }

.time {
    width: 150px;
}

/* 이름 입력 칸 */
.name-cell {
    cursor: pointer;
    background: white;
}

.name-cell:hover {
    background: #eef7ff;
}

.empty::after {
    content: "클릭하여 입력";
    color: #aaa;
    font-size: 12px;
}

/* 안내 */
.guide {
    text-align: center;
    color: #777;
    font-size: 14px;
    margin-top: -15px;
}

/* 팝업 */
.modal-bg {
    display: none;
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: rgba(0,0,0,0.4);
    justify-content: center;
    align-items: center;
    z-index: 100;
}

.modal-bg.show {
    display: flex;
}

.modal {
    width: 350px;
    background: white;
    border-radius: 12px;
    padding: 25px;
    box-shadow: 0 10px 40px rgba(0,0,0,0.3);
}

.modal h2 {
    margin-top: 0;
}

.modal-info {
    color: #666;
    font-size: 14px;
    margin-bottom: 15px;
}

.modal input {
    width: 100%;
    padding: 12px;
    border: 1px solid #aaa;
    border-radius: 6px;
    font-size: 16px;
}

.buttons {
    display: flex;
    gap: 8px;
    margin-top: 15px;
}

.buttons button {
    flex: 1;
    padding: 11px;
    border: none;
    border-radius: 6px;
    cursor: pointer;
    font-size: 15px;
}

.save { background: #2878d4; color: white; }
.delete { background: #e54848; color: white; }
.cancel { background: #ddd; }

/* 모바일 */
@media (max-width: 700px) {
    body { padding: 10px; }
    .top-bar { flex-direction: column; gap: 10px; }
    h1 { font-size: 22px; }
    .schedule { font-size: 13px; }
    .schedule th, .schedule td { height: 48px; padding: 3px; }
    .schedule .title { font-size: 17px; }
    .time { width: 105px; }
    .empty::after { content: "+"; font-size: 18px; }
}

/* 인쇄 스타일 */
@media print {
    body {
        padding: 0;
        background: white;
    }
    .print-btn, .guide, .modal-bg {
        display: none !important;
    }
    .top-bar {
        justify-content: center;
        margin-bottom: 15px;
    }
    .schedule {
        margin-bottom: 20px;
        page-break-inside: avoid;
    }
    .schedule th, .schedule td {
        border: 1px solid #000;
    }
    .empty::after {
        content: "";
    }
}
</style>
</head>

<body>

<div class="top-bar">
    <h1>떡삼 부스 시간표</h1>
    <button class="print-btn" onclick="window.print()">인쇄</button>
</div>

<div id="tables"></div>

<div class="guide">
    빈 칸을 클릭하여 이름을 입력하세요. 이미 입력된 이름을 클릭하면 수정 또는 삭제할 수 있습니다.
</div>

<!-- 이름 입력 팝업 -->
<div class="modal-bg" id="modal">
    <div class="modal">
        <h2 id="modalTitle">이름 입력</h2>
        <div class="modal-info" id="modalInfo"></div>
        <input type="text" id="nameInput" maxlength="4" placeholder="이름을 입력하세요 (최대 4자)">
        <div class="buttons">
            <button class="save" id="btnSave">저장</button>
            <button class="delete" id="btnDelete">삭제</button>
            <button class="cancel" id="btnCancel">취소</button>
        </div>
    </div>
</div>

<!-- Firebase 모듈 및 실시간 연동 로직 -->
<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
  import { getDatabase, ref, onValue, set } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

  const firebaseConfig = {
    apiKey: "AIzaSyDuh5dW1F4QnJcdiSjBWEzOrsU4IuUAWQ8",
    authDomain: "dducksam-3c6d2.firebaseapp.com",
    databaseURL: "https://dducksam-3c6d2-default-rtdb.europe-west1.firebasedatabase.app",
    projectId: "dducksam-3c6d2",
    storageBucket: "dducksam-3c6d2.firebasestorage.app",
    messagingSenderId: "17114391457",
    appId: "1:17114391457:web:285dd96bf44fd9b29d61e0"
  };

  const app = initializeApp(firebaseConfig);
  const db = getDatabase(app);
  const dbRef = ref(db, 'scheduleData');

  const schedules = [
      {
          date: "9월 15일 (화요일)",
          className: "day15",
          times: ["(오픈) 10:00-11:00", "11:00-12:00", "12:00-13:00", "13:00-14:00", "14:00-15:00", "15:00-16:00", "(정리) 16:00-17:00"],
          roles: ["떡", "삼겹살", "꼬치", "소스", "보조", "재정"],
          names: [
              ["","","","","",""],
              ["","","","","",""],
              ["","","","","",""],
              ["","","","","",""],
              ["","","","","",""],
              ["","","","","",""],
              ["","","","","",""]
          ]
      },
      {
          date: "9월 16일 (수요일)",
          className: "day16",
          times: ["(오픈) 10:00-11:00", "11:00-12:00", "12:00-13:00", "13:00-14:00", "14:00-15:00", "15:00-16:00", "(정리) 16:00-17:00"],
          roles: ["떡", "삼겹살", "꼬치", "소스", "보조", "재정"],
          names: [
              ["","","","","",""],
              ["","","","","",""],
              ["","","","","",""],
              ["","","","","",""],
              ["","","","","",""],
              ["","","","","",""],
              ["","","","","",""]
          ]
      },
      {
          date: "9월 17일 (목요일)",
          className: "day17",
          times: ["(오픈) 10:00-11:00", "11:00-12:00", "12:00-13:00", "13:00-14:00", "14:00-15:00", "15:00-16:00", "(정리) 16:00-17:00"],
          roles: ["떡", "삼겹살", "꼬치", "소스", "보조", "재정"],
          names: [
              ["","","","","",""],
              ["","","","","",""],
              ["","","","","",""],
              ["","","","","",""],
              ["","","","","",""],
              ["","","","","",""],
              ["","","","","",""]
          ]
      }
  ];

  let currentData = null;
  let selected = null;

  // 실시간 동기화 수신
  onValue(dbRef, (snapshot) => {
      const data = snapshot.val();
      
      const isOldData = data && (
          !data[1] || data[1].length < 7 || 
          !data[2] || data[2].length < 7 ||
          (data[2][0] && data[2][0].length > 6)
      );

      if (data && !isOldData) {
          currentData = data;
      } else {
          currentData = schedules.map(s => s.names.map(row => [...row]));
          set(dbRef, currentData);
      }
      createTables();
  });

  function createTables() {
      if (!currentData) return;
      const container = document.getElementById("tables");
      container.innerHTML = "";

      schedules.forEach((schedule, dayIndex) => {
          const table = document.createElement("table");
          table.className = "schedule " + schedule.className;

          const titleRow = table.insertRow();
          const titleCell = titleRow.insertCell();
          titleCell.colSpan = schedule.roles.length + 1;
          titleCell.className = "title";
          titleCell.textContent = `떡삼 부스 '${schedule.date}' 시간표`;

          const header = table.insertRow();
          const timeHeader = document.createElement("th");
          timeHeader.textContent = "시간대";
          timeHeader.className = "time";
          header.appendChild(timeHeader);

          schedule.roles.forEach(role => {
              const th = document.createElement("th");
              th.textContent = role;
              header.appendChild(th);
          });

          schedule.times.forEach((time, rowIndex) => {
              const row = table.insertRow();
              const timeCell = row.insertCell();
              timeCell.textContent = time;
              timeCell.className = "time";

              schedule.roles.forEach((role, colIndex) => {
                  const cell = row.insertCell();
                  cell.className = "name-cell";

                  const name = (currentData[dayIndex] && currentData[dayIndex][rowIndex] && currentData[dayIndex][rowIndex][colIndex]) || "";

                  if (name === "") {
                      cell.classList.add("empty");
                  } else {
                      cell.classList.remove("empty");
                  }

                  cell.textContent = name;

                  cell.onclick = function() {
                      openModal(dayIndex, rowIndex, colIndex);
                  };
              });
          });

          container.appendChild(table);
      });
  }

  function openModal(day, row, col) {
      selected = { day, row, col };
      const currentName = (currentData[day] && currentData[day][row] && currentData[day][row][col]) || "";
      const schedule = schedules[day];

      document.getElementById("modalTitle").textContent = currentName ? "이름 수정" : "이름 입력";
      document.getElementById("modalInfo").textContent = `${schedule.date} / ${schedule.times[row]} / ${schedule.roles[col]}`;
      document.getElementById("nameInput").value = currentName;
      document.getElementById("btnDelete").style.display = currentName ? "block" : "none";

      document.getElementById("modal").classList.add("show");

      setTimeout(() => {
          document.getElementById("nameInput").focus();
      }, 100);
  }

  function saveName() {
      if (!selected) return;
      const name = document.getElementById("nameInput").value.trim();

      if (!currentData[selected.day]) currentData[selected.day] = [];
      if (!currentData[selected.day][selected.row]) currentData[selected.day][selected.row] = [];

      currentData[selected.day][selected.row][selected.col] = name;
      
      set(dbRef, currentData);
      closeModal();
  }

  function deleteName() {
      if (!selected) return;
      currentData[selected.day][selected.row][selected.col] = "";
      
      set(dbRef, currentData);
      closeModal();
  }

  function closeModal() {
      document.getElementById("modal").classList.remove("show");
      selected = null;
  }

  document.getElementById("btnSave").addEventListener("click", saveName);
  document.getElementById("btnDelete").addEventListener("click", deleteName);
  document.getElementById("btnCancel").addEventListener("click", closeModal);

  document.getElementById("nameInput").addEventListener("keydown", function(event) {
      if (event.key === "Enter") saveName();
      if (event.key === "Escape") closeModal();
  });

  document.getElementById("modal").addEventListener("click", function(event) {
      if (event.target === this) closeModal();
  });
</script>

</body>
</html>
